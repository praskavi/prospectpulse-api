<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>ProspectPulse Admin</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-shell { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 28px 24px 72px; }
    .admin-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .admin-kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--text3); margin-bottom: 6px; }
    .admin-title { font-size: 26px; font-weight: 750; letter-spacing: 0; }
    .admin-subtitle { margin-top: 6px; color: var(--text2); font-size: 13px; }
    .admin-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 22px; }
    .admin-tab { border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--text2); border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; font-size: 12px; }
    .admin-tab.active { color: var(--text); border-color: rgba(249,115,22,.45); background: rgba(249,115,22,.12); }
    .admin-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .admin-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; min-width: 0; }
    .admin-card-label { color: var(--text3); text-transform: uppercase; letter-spacing: .08em; font-size: 10px; margin-bottom: 6px; }
    .admin-card-value { font-size: 24px; font-weight: 760; color: var(--text); }
    .admin-card-sub { color: var(--text3); font-size: 11px; margin-top: 4px; }
    .admin-panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
    .admin-panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .admin-panel-title { font-weight: 680; font-size: 14px; }
    .admin-panel-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .admin-input, .admin-select { background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 8px 10px; font: inherit; font-size: 12px; min-height: 34px; }
    .admin-input { min-width: 220px; }
    .admin-btn { border: 1px solid var(--border2); background: rgba(255,255,255,.04); color: var(--text2); border-radius: 7px; padding: 8px 12px; font: inherit; font-size: 12px; cursor: pointer; }
    .admin-btn:hover { border-color: var(--accent2); color: var(--text); }
    .admin-table-wrap { width: 100%; overflow-x: auto; }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th { cursor: default; }
    .admin-table td, .admin-table th { padding: 10px 12px; white-space: nowrap; }
    .admin-table td.wrap-cell { white-space: normal; min-width: 260px; }
    .admin-id { font-family: Consolas, 'Courier New', monospace; color: var(--text3); font-size: 11px; }
    .status-pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 650; border: 1px solid var(--border); }
    .pill-free { color: #a3a3a3; background: rgba(255,255,255,.06); }
    .pill-starter { color: #93c5fd; background: rgba(59,130,246,.12); }
    .pill-growth { color: #6ee7b7; background: rgba(16,185,129,.12); }
    .pill-failed { color: #fca5a5; background: rgba(239,68,68,.12); }
    .pill-running { color: #fdba74; background: rgba(249,115,22,.12); }
    .pill-completed { color: #6ee7b7; background: rgba(16,185,129,.12); }
    .pill-open { color: #fdba74; background: rgba(249,115,22,.12); }
    .pill-in_progress { color: #93c5fd; background: rgba(59,130,246,.12); }
    .pill-resolved, .pill-closed { color: #6ee7b7; background: rgba(16,185,129,.12); }
    .pill-urgent, .pill-high { color: #fca5a5; background: rgba(239,68,68,.12); }
    .pill-normal, .pill-low { color: #a3a3a3; background: rgba(255,255,255,.06); }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
    .admin-state { padding: 18px 16px; color: var(--text2); font-size: 13px; }
    .admin-state.error { color: #fca5a5; }
    .admin-muted { color: var(--text3); }
    .admin-link { color: var(--accent2); cursor: pointer; text-decoration: none; }
    .admin-link:hover { text-decoration: underline; }
    @media (max-width: 980px) { .admin-grid { grid-template-columns: repeat(2, 1fr); } .admin-header { align-items: flex-start; flex-direction: column; } }
    @media (max-width: 560px) { .admin-grid { grid-template-columns: 1fr; } .admin-input { min-width: 100%; } .admin-panel-header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="app.html" class="logo">
        <div class="logo-icon">PP</div>
        <span class="logo-text">Prospect<span>Pulse</span></span>
        <span class="logo-badge">Admin</span>
      </a>
      <div class="nav-actions">
        <button class="admin-btn" onclick="window.location.href='app.html'">Back to App</button>
        <button class="admin-btn" onclick="logout()">Sign Out</button>
      </div>
    </div>
  </nav>

  <main class="admin-shell">
    <div class="admin-header">
      <div>
        <div class="admin-kicker">Internal Operations</div>
        <h1 class="admin-title">Admin Dashboard</h1>
        <p class="admin-subtitle" id="adminSubtitle">Loading protected admin data...</p>
      </div>
      <button class="admin-btn" onclick="refreshActive()">Refresh</button>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="overview" onclick="showTab('overview')">Overview</button>
      <button class="admin-tab" data-tab="users" onclick="showTab('users')">Users</button>
      <button class="admin-tab" data-tab="searches" onclick="showTab('searches')">Searches</button>
      <button class="admin-tab" data-tab="transactions" onclick="showTab('transactions')">Transactions</button>
      <button class="admin-tab" data-tab="support" onclick="showTab('support')">Support</button>
      <button class="admin-tab" data-tab="billing" onclick="showTab('billing')">Billing Health</button>
      <button class="admin-tab" data-tab="webhooks" onclick="showTab('webhooks')">Webhooks</button>
      <button class="admin-tab" data-tab="system" onclick="showTab('system')">System</button>
    </div>

    <section class="admin-section active" id="section-overview"></section>
    <section class="admin-section" id="section-users"></section>
    <section class="admin-section" id="section-searches"></section>
    <section class="admin-section" id="section-transactions"></section>
    <section class="admin-section" id="section-support"></section>
    <section class="admin-section" id="section-billing"></section>
    <section class="admin-section" id="section-webhooks"></section>
    <section class="admin-section" id="section-system"></section>
  </main>

  <script>
    const state = { active: 'overview', loaded: new Set(), filters: {} };

    function token() { return localStorage.getItem('pp_access_token'); }
    function authHeaders() { return token() ? { Authorization: `Bearer ${token()}` } : {}; }
    function logout() {
      localStorage.removeItem('pp_access_token');
      localStorage.removeItem('pp_refresh_token');
      localStorage.removeItem('pp_user_email');
      localStorage.removeItem('pp_user_id');
      window.location.href = 'login.html';
    }
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmt(n) { return Number(n || 0).toLocaleString(); }
    function date(s) { return s ? new Date(s).toLocaleString('en-AU', { dateStyle: 'medium', timeStyle: 'short' }) : '-'; }
    function pill(value) {
      const v = String(value || 'unknown');
      return `<span class="status-pill pill-${esc(v)}">${esc(v)}</span>`;
    }
    function userLink(userId, label) {
      return userId ? `<a class="admin-link" href="admin-user.html?id=${encodeURIComponent(userId)}">${esc(label || userId)}</a>` : esc(label || '-');
    }
    function searchLink(searchId, label) {
      return searchId ? `<a class="admin-link admin-id" href="admin-search.html?id=${encodeURIComponent(searchId)}">${esc(label || searchId)}</a>` : '-';
    }
    async function api(path) {
      const res = await fetch(`/api/admin${path}`, { headers: authHeaders() });
      const json = await res.json().catch(() => ({}));
      if (res.status === 401) { logout(); return null; }
      if (res.status === 403) throw new Error(json.message || 'Admin access required.');
      if (!res.ok) throw new Error(json.message || `HTTP ${res.status}`);
      return json.data;
    }
    function setSection(name, html) { document.getElementById(`section-${name}`).innerHTML = html; }
    function loading(name) { setSection(name, '<div class="admin-panel"><div class="admin-state">Loading...</div></div>'); }
    function errorView(name, error) { setSection(name, `<div class="admin-panel"><div class="admin-state error">${esc(error.message || error)}</div></div>`); }
    function card(label, value, sub = '') {
      return `<div class="admin-card"><div class="admin-card-label">${esc(label)}</div><div class="admin-card-value">${esc(value)}</div><div class="admin-card-sub">${esc(sub)}</div></div>`;
    }
    function table(headers, rows, empty = 'No rows found.') {
      if (!rows.length) return `<div class="admin-state">${esc(empty)}</div>`;
      return `<div class="admin-table-wrap"><table class="admin-table"><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
    }
    function qs(formId, defaults = { limit: 50 }) {
      const params = new URLSearchParams(defaults);
      const form = document.getElementById(formId);
      if (form) {
        state.filters[formId] = {};
        form.querySelectorAll('input, select').forEach(el => {
          const value = el.type === 'checkbox' ? (el.checked ? 'true' : '') : el.value.trim();
          if (value) {
            params.set(el.name, value);
            state.filters[formId][el.name] = value;
          }
        });
      } else {
        Object.entries(state.filters[formId] || {}).forEach(([key, value]) => params.set(key, value));
      }
      return params.toString();
    }
    function fv(formId, name) { return esc(state.filters[formId]?.[name] || ''); }
    function fs(formId, name, value) { return state.filters[formId]?.[name] === value ? 'selected' : ''; }
    function fc(formId, name) { return state.filters[formId]?.[name] === 'true' ? 'checked' : ''; }
    function clearFilters(formId) {
      const form = document.getElementById(formId);
      if (!form) return;
      form.querySelectorAll('input, select').forEach(el => {
        if (el.type === 'checkbox') el.checked = false;
        else el.value = '';
      });
      refreshActive();
    }
    function showTab(name) {
      state.active = name;
      document.querySelectorAll('.admin-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === name));
      document.querySelectorAll('.admin-section').forEach(section => section.classList.toggle('active', section.id === `section-${name}`));
      if (!state.loaded.has(name)) loadTab(name);
    }
    function refreshActive() {
      state.loaded.delete(state.active);
      loadTab(state.active);
    }
    async function loadTab(name) {
      loading(name);
      try {
        if (name === 'overview') await loadOverview();
        if (name === 'users') await loadUsers();
        if (name === 'searches') await loadSearches();
        if (name === 'transactions') await loadTransactions();
        if (name === 'support') await loadSupport();
        if (name === 'billing') await loadBilling();
        if (name === 'webhooks') await loadWebhooks();
        if (name === 'system') await loadSystem();
        state.loaded.add(name);
      } catch (error) {
        errorView(name, error);
      }
    }

    async function loadOverview() {
      const data = await api('/overview');
      document.getElementById('adminSubtitle').textContent = `${data.admin.email} - ${data.admin.role}`;
      const cards = [
        card('Total Users', fmt(data.users.total), `${fmt(data.users.zeroCredits)} zero-credit`),
        card('Paid Users', fmt(data.users.starter + data.users.growth), `${fmt(data.users.starter)} Starter / ${fmt(data.users.growth)} Growth`),
        card('Searches 24h', fmt(data.searches.last24h), `${fmt(data.searches.failedLast24h)} failed`),
        card('Open Support', fmt(data.support?.open), 'open or in progress'),
        card('Stuck Running', fmt(data.searches.stuckRunning), 'running over 15 minutes'),
        card('Webhook Failures', fmt(data.webhooks?.failedLast24h), 'failed in last 24 hours'),
      ].join('');
      const failedRows = (data.recentFailedSearches || []).map(s => `<tr><td>${searchLink(s.id)}</td><td>${esc(s.business_category)}</td><td>${esc(s.location)}</td><td>${date(s.created_at)}</td></tr>`);
      const txRows = (data.recentTransactions || []).map(t => `<tr><td>${pill(t.transaction_type)}</td><td class="${t.credits < 0 ? 'ch-credits-neg' : 'ch-credits-pos'}">${fmt(t.credits)}</td><td class="wrap-cell">${esc(t.description)}</td><td>${t.related_search_id ? searchLink(t.related_search_id) : '-'}</td><td>${date(t.created_at)}</td></tr>`);
      const webhookRows = (data.recentWebhookFailures || []).map(event => `<tr><td class="admin-id">${esc(event.stripe_event_id)}</td><td>${esc(event.event_type)}</td><td>${fmt(event.attempts)}</td><td class="wrap-cell">${esc(event.error_message || '-')}</td><td>${date(event.updated_at)}</td></tr>`);
      setSection('overview', `
        <div class="admin-grid">${cards}</div>
        <div class="admin-panel"><div class="admin-panel-header"><div class="admin-panel-title">Latest Failed Searches</div></div>${table(['Search ID','Category','Location','Created'], failedRows)}</div>
        <div class="admin-panel"><div class="admin-panel-header"><div class="admin-panel-title">Latest Webhook Failures</div></div>${table(['Event ID','Type','Attempts','Error','Updated'], webhookRows)}</div>
        <div class="admin-panel"><div class="admin-panel-header"><div class="admin-panel-title">Latest Credit Transactions</div></div>${table(['Type','Credits','Description','Search','Created'], txRows)}</div>
      `);
    }

    async function loadUsers() {
      const data = await api(`/users?${qs('usersFilters')}`);
      const rows = data.map(u => `<tr>
        <td>${userLink(u.id, u.email || u.id)}</td>
        <td>${pill(u.plan_code)}</td>
        <td>${fmt(u.credits_remaining)}</td>
        <td class="admin-id">${esc(u.stripe_customer_id || '-')}</td>
        <td>${esc(u.last_paid_plan_code || '-')}</td>
        <td>${date(u.subscription_cancelled_at || u.subscription_cancel_at || u.free_plan_eligible_at)}</td>
      </tr>`);
      setSection('users', `<div class="admin-panel"><div class="admin-panel-header"><div class="admin-panel-title">Users</div><form class="admin-panel-tools" id="usersFilters" onsubmit="event.preventDefault(); refreshActive();">
        <input class="admin-input" name="email" placeholder="Email contains" value="${fv('usersFilters', 'email')}" />
        <select class="admin-select" name="plan"><option value="">Any plan</option><option value="free" ${fs('usersFilters', 'plan', 'free')}>Free</option><option value="starter" ${fs('usersFilters', 'plan', 'starter')}>Starter</option><option value="growth" ${fs('usersFilters', 'plan', 'growth')}>Growth</option></select>
        <select class="admin-select" name="hasStripeCustomer"><option value="">Stripe: any</option><option value="true" ${fs('usersFilters', 'hasStripeCustomer', 'true')}>Has Stripe ID</option><option value="false" ${fs('usersFilters', 'hasStripeCustomer', 'false')}>Missing Stripe ID</option></select>
        <label class="admin-muted"><input type="checkbox" name="zeroCredits" ${fc('usersFilters', 'zeroCredits')} /> Zero credits</label>
        <label class="admin-muted"><input type="checkbox" name="cancelled" ${fc('usersFilters', 'cancelled')} /> Cancelled</label>
        <label class="admin-muted"><input type="checkbox" name="lockout" ${fc('usersFilters', 'lockout')} /> Lockout</label>
        <button class="admin-btn" type="submit">Apply</button><button class="admin-btn" type="button" onclick="clearFilters('usersFilters')">Clear</button>
      </form></div><div class="admin-state">${data.length} loaded</div>${table(['Email','Plan','Credits','Stripe Customer','Last Paid','Cancellation/Lockout'], rows)}</div>`);
    }

    async function loadSearches() {
      const data = await api(`/searches?${qs('searchesFilters')}`);
      const rows = data.map(s => `<tr>
        <td>${searchLink(s.id)}</td>
        <td>${userLink(s.user_id, s.email || s.user_id)}</td>
        <td>${esc(s.business_category)}</td>
        <td>${esc(s.location)}</td>
        <td>${pill(s.search_status)}</td>
        <td>${fmt(s.estimated_credits)}</td>
        <td>${fmt(s.actual_credits)}</td>
        <td>${fmt(s.businesses_found)}</td>
        <td>${date(s.created_at)}</td>
      </tr>`);
      setSection('searches', `<div class="admin-panel"><div class="admin-panel-header"><div class="admin-panel-title">Searches</div><form class="admin-panel-tools" id="searchesFilters" onsubmit="event.preventDefault(); refreshActive();">
        <select class="admin-select" name="status"><option value="">Any status</option><option value="running" ${fs('searchesFilters', 'status', 'running')}>Running</option><option value="completed" ${fs('searchesFilters', 'status', 'completed')}>Completed</option><option value="failed" ${fs('searchesFilters', 'status', 'failed')}>Failed</option></select>
        <input class="admin-input" name="userId" placeholder="User ID" value="${fv('searchesFilters', 'userId')}" />
        <input class="admin-input" name="category" placeholder="Category contains" value="${fv('searchesFilters', 'category')}" />
        <input class="admin-input" name="location" placeholder="Location contains" value="${fv('searchesFilters', 'location')}" />
        <label class="admin-muted"><input type="checkbox" name="failedOnly" ${fc('searchesFilters', 'failedOnly')} /> Failed only</label>
        <label class="admin-muted"><input type="checkbox" name="stuck" ${fc('searchesFilters', 'stuck')} /> Stuck</label>
        <button class="admin-btn" type="submit">Apply</button><button class="admin-btn" type="button" onclick="clearFilters('searchesFilters')">Clear</button>
      </form></div><div class="admin-state">${data.length} loaded</div>${table(['ID','User','Category','Location','Status','Estimated','Actual','Businesses','Created'], rows)}</div>`);
    }

    async function loadTransactions() {
      const data = await api(`/transactions?${qs('transactionsFilters')}`);
      const rows = data.map(t => `<tr>
        <td>${userLink(t.user_id, t.email || t.user_id)}</td>
        <td>${pill(t.transaction_type)}</td>
        <td class="${t.credits < 0 ? 'ch-credits-neg' : 'ch-credits-pos'}">${fmt(t.credits)}</td>
        <td class="wrap-cell">${esc(t.description)}</td>
        <td>${t.related_search_id ? searchLink(t.related_search_id) : '-'}</td>
        <td>${date(t.created_at)}</td>
      </tr>`);
      setSection('transactions', `<div class="admin-panel"><div class="admin-panel-header"><div class="admin-panel-title">Credit Transactions</div><form class="admin-panel-tools" id="transactionsFilters" onsubmit="event.preventDefault(); refreshActive();">
        <input class="admin-input" name="userId" placeholder="User ID" value="${fv('transactionsFilters', 'userId')}" />
        <select class="admin-select" name="type"><option value="">Any type</option><option value="subscription" ${fs('transactionsFilters', 'type', 'subscription')}>Subscription</option><option value="search" ${fs('transactionsFilters', 'type', 'search')}>Search</option><option value="unlock" ${fs('transactionsFilters', 'type', 'unlock')}>Unlock</option></select>
        <label class="admin-muted"><input type="checkbox" name="positive" ${fc('transactionsFilters', 'positive')} /> Positive</label>
        <label class="admin-muted"><input type="checkbox" name="negative" ${fc('transactionsFilters', 'negative')} /> Negative</label>
        <button class="admin-btn" type="submit">Apply</button><button class="admin-btn" type="button" onclick="clearFilters('transactionsFilters')">Clear</button>
      </form></div><div class="admin-state">${data.length} loaded</div>${table(['User','Type','Credits','Description','Search ID','Created'], rows)}</div>`);
    }

    async function updateTicketStatus(ticketId, status) {
      const res = await fetch(`/api/admin/support-tickets/${encodeURIComponent(ticketId)}`, {
        method: 'PATCH',
        headers: { ...authHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) {
        alert(json.message || `Could not update ticket (${res.status})`);
        return;
      }
      state.loaded.delete('support');
      loadSupport();
    }

    async function retryTicketWorkflow(ticketId) {
      const res = await fetch(`/api/admin/support-tickets/${encodeURIComponent(ticketId)}/retry-workflow`, {
        method: 'POST',
        headers: authHeaders(),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) {
        alert(json.message || `Could not retry workflow (${res.status})`);
      }
      state.loaded.delete('support');
      loadSupport();
    }

    async function loadSupport() {
      const data = await api(`/support-tickets?${qs('supportFilters')}`);
      const rows = data.map(ticket => `<tr>
        <td class="admin-id">${esc(ticket.ticket_id)}</td>
        <td>${pill(ticket.status)}</td>
        <td>${pill(ticket.priority)}</td>
        <td>${esc(ticket.category)}</td>
        <td><a class="admin-link" href="mailto:${esc(ticket.email)}">${esc(ticket.email)}</a></td>
        <td class="wrap-cell"><strong>${esc(ticket.subject)}</strong><br><span class="admin-muted">${esc(ticket.name || '-')} · ${esc(ticket.source || '-')}</span></td>
        <td>${pill(ticket.n8n_status)}</td>
        <td>${date(ticket.created_at)}</td>
        <td>
          <button class="admin-btn" onclick="updateTicketStatus('${esc(ticket.ticket_id)}', 'in_progress')">Start</button>
          <button class="admin-btn" onclick="updateTicketStatus('${esc(ticket.ticket_id)}', 'resolved')">Resolve</button>
          <button class="admin-btn" onclick="retryTicketWorkflow('${esc(ticket.ticket_id)}')">Retry n8n</button>
        </td>
      </tr>`);
      setSection('support', `<div class="admin-panel"><div class="admin-panel-header"><div class="admin-panel-title">Support Tickets</div><form class="admin-panel-tools" id="supportFilters" onsubmit="event.preventDefault(); refreshActive();">
        <select class="admin-select" name="status"><option value="">Any status</option><option value="open" ${fs('supportFilters', 'status', 'open')}>Open</option><option value="in_progress" ${fs('supportFilters', 'status', 'in_progress')}>In progress</option><option value="resolved" ${fs('supportFilters', 'status', 'resolved')}>Resolved</option><option value="closed" ${fs('supportFilters', 'status', 'closed')}>Closed</option></select>
        <select class="admin-select" name="priority"><option value="">Any priority</option><option value="urgent" ${fs('supportFilters', 'priority', 'urgent')}>Urgent</option><option value="high" ${fs('supportFilters', 'priority', 'high')}>High</option><option value="normal" ${fs('supportFilters', 'priority', 'normal')}>Normal</option><option value="low" ${fs('supportFilters', 'priority', 'low')}>Low</option></select>
        <select class="admin-select" name="category"><option value="">Any category</option><option value="billing" ${fs('supportFilters', 'category', 'billing')}>Billing</option><option value="credits" ${fs('supportFilters', 'category', 'credits')}>Credits</option><option value="search" ${fs('supportFilters', 'category', 'search')}>Search</option><option value="account" ${fs('supportFilters', 'category', 'account')}>Account</option><option value="privacy" ${fs('supportFilters', 'category', 'privacy')}>Privacy</option><option value="security" ${fs('supportFilters', 'category', 'security')}>Security</option><option value="general" ${fs('supportFilters', 'category', 'general')}>General</option></select>
        <select class="admin-select" name="n8nStatus"><option value="">n8n: any</option><option value="not_sent" ${fs('supportFilters', 'n8nStatus', 'not_sent')}>Not sent</option><option value="sent" ${fs('supportFilters', 'n8nStatus', 'sent')}>Sent</option><option value="failed" ${fs('supportFilters', 'n8nStatus', 'failed')}>Failed</option><option value="skipped" ${fs('supportFilters', 'n8nStatus', 'skipped')}>Skipped</option></select>
        <input class="admin-input" name="email" placeholder="Email contains" value="${fv('supportFilters', 'email')}" />
        <input class="admin-input" name="search" placeholder="Ticket, subject, message" value="${fv('supportFilters', 'search')}" />
        <button class="admin-btn" type="submit">Apply</button><button class="admin-btn" type="button" onclick="clearFilters('supportFilters')">Clear</button>
      </form></div><div class="admin-state">${data.length} loaded</div>${table(['Ticket','Status','Priority','Category','Email','Subject','n8n','Created','Actions'], rows)}</div>`);
    }

    function billingTable(title, rows) {
      const trs = rows.map(u => `<tr><td>${userLink(u.id, u.id)}</td><td>${pill(u.plan_code)}</td><td>${fmt(u.credits_remaining)}</td><td class="admin-id">${esc(u.stripe_customer_id || '-')}</td><td>${esc(u.last_paid_plan_code || '-')}</td></tr>`);
      return `<div class="admin-panel"><div class="admin-panel-header"><div class="admin-panel-title">${esc(title)}</div><div class="admin-muted">${rows.length}</div></div>${table(['User ID','Plan','Credits','Stripe Customer','Last Paid'], trs)}</div>`;
    }
    async function loadBilling() {
      const data = await api('/billing/health');
      setSection('billing', [
        billingTable('Paid Users Missing Stripe Customer', data.paidMissingStripe || []),
        billingTable('Free Users With Stripe Customer', data.freeWithStripe || []),
        billingTable('Fake Stripe Customer IDs', data.fakeStripeIds || []),
        billingTable('Cancellation / Free Lockout Users', data.cancellationLockouts || []),
      ].join(''));
    }
    async function loadWebhooks() {
      const data = await api(`/webhooks?${qs('webhooksFilters')}`);
      const rows = data.map(event => `<tr>
        <td class="admin-id">${esc(event.stripe_event_id)}</td>
        <td>${esc(event.event_type)}</td>
        <td>${pill(event.status)}</td>
        <td>${esc(event.job_id || '-')}</td>
        <td>${fmt(event.attempts)}</td>
        <td class="wrap-cell">${esc(event.error_message || '-')}</td>
        <td>${date(event.received_at)}</td>
        <td>${date(event.processed_at)}</td>
      </tr>`);
      setSection('webhooks', `<div class="admin-panel"><div class="admin-panel-header"><div class="admin-panel-title">Stripe Webhooks</div><form class="admin-panel-tools" id="webhooksFilters" onsubmit="event.preventDefault(); refreshActive();">
        <select class="admin-select" name="status"><option value="">Any status</option><option value="received" ${fs('webhooksFilters', 'status', 'received')}>Received</option><option value="queued" ${fs('webhooksFilters', 'status', 'queued')}>Queued</option><option value="processing" ${fs('webhooksFilters', 'status', 'processing')}>Processing</option><option value="processed" ${fs('webhooksFilters', 'status', 'processed')}>Processed</option><option value="ignored" ${fs('webhooksFilters', 'status', 'ignored')}>Ignored</option><option value="failed" ${fs('webhooksFilters', 'status', 'failed')}>Failed</option></select>
        <input class="admin-input" name="eventType" placeholder="Event type" value="${fv('webhooksFilters', 'eventType')}" />
        <button class="admin-btn" type="submit">Apply</button><button class="admin-btn" type="button" onclick="clearFilters('webhooksFilters')">Clear</button>
      </form></div><div class="admin-state">${data.length} loaded</div>${table(['Event ID','Type','Status','Job','Attempts','Error','Received','Processed'], rows)}</div>`);
    }
    async function loadSystem() {
      const data = await api('/system/health');
      const redisDetail = data.redis.counts
        ? Object.entries(data.redis.counts).map(([key, value]) => `${key}: ${value}`).join(' / ')
        : (data.redis.error || 'No queue counts available');
      setSection('system', `
        <div class="admin-grid">
          ${card('API', data.api, data.checkedAt)}
          ${card('Database', data.database, 'service-role query ok')}
          ${card('Profiles', fmt(data.counts.profiles))}
          ${card('Searches', fmt(data.counts.searches))}
        </div>
        <div class="admin-panel"><div class="admin-state">Redis/BullMQ: ${esc(data.redis.status)} - ${esc(redisDetail)}</div></div>
      `);
    }

    if (!token()) {
      window.location.href = 'login.html';
    } else {
      loadTab('overview');
    }
  </script>
</body>
</html>
