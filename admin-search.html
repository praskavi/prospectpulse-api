<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>ProspectPulse Admin - Search</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-shell { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 28px 24px 72px; }
    .admin-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .admin-kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--text3); margin-bottom: 6px; }
    .admin-title { font-size: 26px; font-weight: 750; letter-spacing: 0; overflow-wrap: anywhere; }
    .admin-subtitle { margin-top: 6px; color: var(--text2); font-size: 13px; }
    .admin-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .admin-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; min-width: 0; }
    .admin-card-label { color: var(--text3); text-transform: uppercase; letter-spacing: .08em; font-size: 10px; margin-bottom: 6px; }
    .admin-card-value { font-size: 20px; font-weight: 760; color: var(--text); overflow-wrap: anywhere; }
    .admin-card-sub { color: var(--text3); font-size: 11px; margin-top: 4px; overflow-wrap: anywhere; }
    .admin-panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
    .admin-panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .admin-panel-title { font-weight: 680; font-size: 14px; }
    .admin-panel-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .admin-btn { border: 1px solid var(--border2); background: rgba(255,255,255,.04); color: var(--text2); border-radius: 7px; padding: 8px 12px; font: inherit; font-size: 12px; cursor: pointer; }
    .admin-btn:hover { border-color: var(--accent2); color: var(--text); }
    .admin-table-wrap { width: 100%; overflow-x: auto; }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th { cursor: default; }
    .admin-table td, .admin-table th { padding: 10px 12px; white-space: nowrap; }
    .admin-table td.wrap-cell { white-space: normal; min-width: 220px; }
    .admin-id { font-family: Consolas, 'Courier New', monospace; color: var(--text3); font-size: 11px; }
    .admin-state { padding: 18px 16px; color: var(--text2); font-size: 13px; }
    .admin-state.error { color: #fca5a5; }
    .admin-muted { color: var(--text3); }
    .admin-link { color: var(--accent2); cursor: pointer; text-decoration: none; }
    .admin-link:hover { text-decoration: underline; }
    .status-pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 650; border: 1px solid var(--border); }
    .pill-false, .pill-free { color: #a3a3a3; background: rgba(255,255,255,.06); }
    .pill-true, .pill-completed { color: #6ee7b7; background: rgba(16,185,129,.12); }
    .pill-failed { color: #fca5a5; background: rgba(239,68,68,.12); }
    .pill-running { color: #fdba74; background: rgba(249,115,22,.12); }
    @media (max-width: 980px) { .admin-grid { grid-template-columns: repeat(2, 1fr); } .admin-header { align-items: flex-start; flex-direction: column; } }
    @media (max-width: 560px) { .admin-grid { grid-template-columns: 1fr; } .admin-panel-header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="admin.html" class="logo">
        <div class="logo-icon">PP</div>
        <span class="logo-text">Prospect<span>Pulse</span></span>
        <span class="logo-badge">Admin</span>
      </a>
      <div class="nav-actions">
        <button class="admin-btn" onclick="window.location.href='admin.html'">Back to Admin</button>
        <button class="admin-btn" onclick="logout()">Sign Out</button>
      </div>
    </div>
  </nav>

  <main class="admin-shell">
    <div class="admin-header">
      <div>
        <div class="admin-kicker">Search Detail</div>
        <h1 class="admin-title" id="title">Loading search...</h1>
        <p class="admin-subtitle" id="subtitle">Reading protected admin data.</p>
      </div>
      <button class="admin-btn" onclick="loadSearch()">Refresh</button>
    </div>
    <section id="content"><div class="admin-panel"><div class="admin-state">Loading...</div></div></section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const searchId = params.get('id');

    function token() { return localStorage.getItem('pp_access_token'); }
    function authHeaders() { return token() ? { Authorization: `Bearer ${token()}` } : {}; }
    function logout() {
      localStorage.removeItem('pp_access_token');
      localStorage.removeItem('pp_refresh_token');
      localStorage.removeItem('pp_user_email');
      localStorage.removeItem('pp_user_id');
      window.location.href = 'login.html';
    }
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmt(n) { return Number(n || 0).toLocaleString(); }
    function date(s) { return s ? new Date(s).toLocaleString('en-AU', { dateStyle: 'medium', timeStyle: 'short' }) : '-'; }
    function pill(value) {
      const v = String(value ?? 'unknown');
      return `<span class="status-pill pill-${esc(v)}">${esc(v)}</span>`;
    }
    function card(label, value, sub = '') {
      return `<div class="admin-card"><div class="admin-card-label">${esc(label)}</div><div class="admin-card-value">${esc(value)}</div><div class="admin-card-sub">${esc(sub)}</div></div>`;
    }
    function table(headers, rows, empty = 'No rows found.') {
      if (!rows.length) return `<div class="admin-state">${esc(empty)}</div>`;
      return `<div class="admin-table-wrap"><table class="admin-table"><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
    }
    function userLink(userId, label) {
      return userId ? `<a class="admin-link" href="admin-user.html?id=${encodeURIComponent(userId)}">${esc(label || userId)}</a>` : esc(label || '-');
    }
    async function copyText(text) {
      if (!text) return;
      await navigator.clipboard.writeText(text);
    }
    async function api(path) {
      const res = await fetch(`/api/admin${path}`, { headers: authHeaders() });
      const json = await res.json().catch(() => ({}));
      if (res.status === 401) { logout(); return null; }
      if (res.status === 403) throw new Error(json.message || 'Admin access required.');
      if (!res.ok) throw new Error(json.message || `HTTP ${res.status}`);
      return json.data;
    }
    function errorView(error) {
      document.getElementById('content').innerHTML = `<div class="admin-panel"><div class="admin-state error">${esc(error.message || error)}</div></div>`;
    }
    async function loadSearch() {
      if (!token()) { logout(); return; }
      if (!searchId) { errorView('Missing search id.'); return; }
      document.getElementById('content').innerHTML = '<div class="admin-panel"><div class="admin-state">Loading...</div></div>';
      try {
        const data = await api(`/searches/${encodeURIComponent(searchId)}`);
        const search = data.search;
        document.getElementById('title').textContent = `${search.business_category || 'Search'} in ${search.location || '-'}`;
        document.getElementById('subtitle').textContent = search.id;

        const cards = [
          card('Status', search.search_status || '-', `created ${date(search.created_at)}`),
          card('Estimated Credits', fmt(search.estimated_credits), 'pre-run estimate'),
          card('Actual Credits', fmt(search.actual_credits), 'charged from output'),
          card('Results', fmt(data.results.length), `${fmt(search.businesses_found)} businesses / ${fmt(search.contacts_found)} contacts`),
        ].join('');

        const results = (data.results || []).map(result => `<tr>
          <td class="wrap-cell">${esc(result.business_name)}</td>
          <td>${esc(result.business_type || '-')}</td>
          <td>${esc([result.city, result.state].filter(Boolean).join(', ') || '-')}</td>
          <td>${esc(result.phone || '-')}</td>
          <td>${esc(result.website || '-')}</td>
          <td>${esc(result.owner_name || '-')}</td>
          <td>${esc(result.email || '-')}</td>
          <td>${pill(Boolean(result.contact_unlocked))}</td>
        </tr>`);

        document.getElementById('content').innerHTML = `
          <div class="admin-grid">${cards}</div>
          <div class="admin-panel">
            <div class="admin-panel-header">
              <div class="admin-panel-title">Search Metadata</div>
              <div class="admin-panel-tools">
                <button class="admin-btn" onclick="copyText('${esc(search.id)}')">Copy Search ID</button>
                <button class="admin-btn" onclick="copyText('${esc(search.user_id)}')">Copy User ID</button>
              </div>
            </div>
            <div class="admin-state">
              Search ID: <span class="admin-id">${esc(search.id)}</span><br>
              User: ${userLink(search.user_id, search.email || search.user_id)}<br>
              Category: ${esc(search.business_category || '-')}<br>
              Location: ${esc(search.location || '-')}<br>
              Max results: ${fmt(search.max_results)}<br>
              Expires: ${date(search.expires_at)}
            </div>
          </div>
          <div class="admin-panel"><div class="admin-panel-header"><div class="admin-panel-title">Search Results</div><div class="admin-muted">${data.results.length} loaded</div></div>${table(['Business','Type','Location','Phone','Website','Owner','Email','Unlocked'], results)}</div>
        `;
      } catch (error) {
        errorView(error);
      }
    }

    loadSearch();
  </script>
</body>
</html>
