<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProspectPulse — Confirming…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --card: #16161f; --border: rgba(255,255,255,0.08);
      --orange: #f97316; --text1: #f1f5f9; --text2: #94a3b8; --text3: #475569;
      --danger: #ef4444; --success: #10b981;
    }
    body {
      background: var(--bg); color: var(--text1);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; margin-bottom: 32px;
    }
    .logo-icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, #f97316, #c2410c);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; color: #fff;
    }
    .logo-text { font-size: 20px; font-weight: 800; color: var(--text1); }
    .logo-text span { color: var(--orange); }
    .card {
      width: 100%; max-width: 400px; background: var(--card);
      border: 1px solid var(--border); border-radius: 20px;
      padding: 40px; text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .sub { font-size: 14px; color: var(--text3); margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block; padding: 12px 28px;
      background: linear-gradient(135deg, var(--orange), #c2410c);
      color: #fff; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 700; font-family: inherit;
      cursor: pointer; text-decoration: none;
      box-shadow: 0 4px 15px rgba(249,115,22,0.3);
    }
    .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid rgba(249,115,22,0.2);
      border-top-color: var(--orange);
      animation: spin 0.8s linear infinite; margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <a href="login.html" class="logo">
    <div class="logo-icon">PP</div>
    <span class="logo-text">Prospect<span>Pulse</span></span>
  </a>

  <div class="card" id="card">
    <div class="spinner"></div>
    <div class="title">Confirming your email…</div>
    <div class="sub">Please wait while we verify your account.</div>
  </div>

  <script>
    function parseHash() {
      const hash = window.location.hash.substring(1);
      return Object.fromEntries(new URLSearchParams(hash));
    }

    function showSuccess(email) {
      document.getElementById('card').innerHTML = `
        <div class="icon">✅</div>
        <div class="title">Email confirmed!</div>
        <div class="sub">Your account is ready. Redirecting to the app…</div>
      `;
      setTimeout(() => { window.location.href = 'app.html'; }, 2000);
    }

    function showError(msg) {
      document.getElementById('card').innerHTML = `
        <div class="icon">⚠️</div>
        <div class="title">Confirmation failed</div>
        <div class="sub">${msg}</div>
        <a class="btn" href="login.html" style="margin-top:8px">Back to sign in</a>
      `;
    }

    // Supabase appends session to the URL hash after email verification
    const params = parseHash();

    if (params.access_token && params.refresh_token) {
      // Store session — same keys as login.html
      localStorage.setItem('pp_access_token',  params.access_token);
      localStorage.setItem('pp_refresh_token', params.refresh_token);

      // Decode the JWT payload to get email (no crypto needed — we just need display info)
      try {
        const payload = JSON.parse(atob(params.access_token.split('.')[1]));
        localStorage.setItem('pp_user_email', payload.email || '');
        localStorage.setItem('pp_user_id',    payload.sub   || '');
      } catch (_) {}

      showSuccess();
    } else if (params.error || params.error_description) {
      showError(params.error_description || params.error || 'The confirmation link is invalid or has expired.');
    } else {
      // No hash params — user may have landed here directly
      showError('No confirmation data found. Please use the link from your email.');
    }
  </script>
</body>
</html>
