<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProspectPulse - Reset Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --bg2: #111118; --card: #16161f;
      --border: rgba(255,255,255,0.08); --orange: #f97316;
      --text1: #f1f5f9; --text2: #94a3b8; --text3: #475569;
      --danger: #ef4444; --success: #10b981;
    }
    body {
      background: var(--bg); color: var(--text1);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; margin-bottom: 32px;
    }
    .logo-icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, #f97316, #c2410c);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; color: #fff;
    }
    .logo-text { font-size: 20px; font-weight: 800; color: var(--text1); }
    .logo-text span { color: var(--orange); }
    .auth-card {
      width: 100%; max-width: 420px; background: var(--card);
      border: 1px solid var(--border); border-radius: 20px; padding: 36px;
    }
    .form-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .form-sub { font-size: 13px; color: var(--text3); margin-bottom: 24px; line-height: 1.5; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text2); margin-bottom: 6px; letter-spacing: 0.3px;
    }
    .field input {
      width: 100%; padding: 10px 14px; background: var(--bg2);
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--text1); font-size: 14px; font-family: inherit; outline: none;
    }
    .field input:focus { border-color: var(--orange); }
    .alert {
      padding: 10px 14px; border-radius: 10px; font-size: 13px;
      margin-bottom: 16px; display: none; align-items: center; gap: 8px;
    }
    .alert.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; display: flex; }
    .alert.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); color: #6ee7b7; display: flex; }
    .btn-submit {
      width: 100%; padding: 12px; background: linear-gradient(135deg, var(--orange), #c2410c);
      color: #fff; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 700; font-family: inherit;
      cursor: pointer; box-shadow: 0 4px 15px rgba(249,115,22,0.3);
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .switch-link { text-align: center; font-size: 13px; color: var(--text3); margin-top: 20px; }
    .switch-link a { color: var(--orange); text-decoration: none; font-weight: 600; }
    .spinner-sm {
      display: inline-block; width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <a href="login.html" class="logo">
    <div class="logo-icon">PP</div>
    <span class="logo-text">Prospect<span>Pulse</span></span>
  </a>

  <div class="auth-card">
    <div class="form-title">Reset password</div>
    <div class="form-sub">Choose a new password for your ProspectPulse account.</div>
    <div class="alert" id="alert"></div>

    <div class="field">
      <label>New Password</label>
      <input type="password" id="password" autocomplete="new-password" />
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" autocomplete="new-password" />
    </div>

    <button class="btn-submit" id="resetBtn" onclick="handleResetPassword()">Update Password</button>

    <div class="switch-link">
      Remembered it? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3000/api';

    function parseHash() {
      return Object.fromEntries(new URLSearchParams(window.location.hash.substring(1)));
    }

    function showAlert(type, msg) {
      const el = document.getElementById('alert');
      el.className = `alert ${type}`;
      el.innerHTML = `<span>${type === 'error' ? '!' : 'OK'}</span><span>${msg}</span>`;
    }

    function setLoading(loading) {
      const btn = document.getElementById('resetBtn');
      btn.disabled = loading;
      btn.innerHTML = loading ? '<span class="spinner-sm"></span>Updating...' : 'Update Password';
    }

    const params = parseHash();
    const accessToken = params.access_token;

    if (params.error || params.error_description) {
      showAlert('error', params.error_description || params.error);
      document.getElementById('resetBtn').disabled = true;
    } else if (!accessToken) {
      showAlert('error', 'Password reset link is invalid or expired. Request a new link from the sign in page.');
      document.getElementById('resetBtn').disabled = true;
    }

    async function handleResetPassword() {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!password || password.length < 6) {
        showAlert('error', 'Password must be at least 6 characters.');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('error', 'Passwords do not match.');
        return;
      }

      setLoading(true);
      try {
        const res = await fetch(`${API}/password/reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert('error', data.message || 'Could not update password.');
          return;
        }

        localStorage.removeItem('pp_access_token');
        localStorage.removeItem('pp_refresh_token');
        showAlert('success', 'Password updated. Redirecting to sign in...');
        setTimeout(() => { window.location.href = 'login.html'; }, 1600);
      } catch (err) {
        showAlert('error', 'Could not connect to server. Is it running?');
      } finally {
        setLoading(false);
      }
    }
  </script>
</body>
</html>
