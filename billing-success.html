<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProspectPulse — Upgrade Successful</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg, #0f1117); color: var(--text, #e2e8f0); font-family: system-ui, sans-serif; }
    .success-card { background: var(--surface, #1a1d2e); border: 1px solid var(--border, #2a2f45); border-radius: 12px; padding: 48px 40px; text-align: center; max-width: 420px; width: 90%; }
    .success-icon { font-size: 3rem; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 12px; color: var(--green, #4ade80); }
    p { color: var(--muted, #94a3b8); margin: 0 0 28px; line-height: 1.6; }
    .redirect-note { font-size: 0.9rem; margin-top: -12px; }
    .btn { display: inline-block; background: var(--accent, #7c3aed); color: #fff; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="success-icon">🎉</div>
    <h1 id="successTitle">You're upgraded!</h1>
    <p id="successMessage">Your plan has been activated and credits have been added to your account. It may take a few seconds for your balance to update.</p>
    <p class="redirect-note">Returning to the app automatically...</p>
    <a class="btn" href="app.html">Go to App</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.has('plan_changed')) {
      document.getElementById('successTitle').textContent = 'Plan updated';
      document.getElementById('successMessage').textContent = 'Your subscription change is being processed. Your plan and credits will update shortly.';
    }

    window.setTimeout(() => {
      window.location.href = 'app.html';
    }, 2500);
  </script>
</body>
</html>
